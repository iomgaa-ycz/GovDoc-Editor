[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "govdoc-auditor-v3"
version = "0.1.0"
description = "GovDoc-Auditor V3: 招标文书自动审查系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "docxtpl>=0.16",
    "python-docx>=1.1",
    "scrivai>=0.1.7",
    "json5>=0.9.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
govdoc-cli = "govdoc.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["govdoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
