app:
  storage_root: ./data/storage
  database_url: sqlite:///./data/app.sqlite
  converter:
    mode: api
    dispatch: fallback
    # 仅用本地 MonkeyOCR：glm 云端 OCR 曾长时间挂死（调用不返回、socket 泄漏），
    # 导致文档卡在 converting，故移除 glm 兜底，OCR 一律走本地 MonkeyOCR。
    api_backends: [monkey]
    monkey_endpoints:
      - "http://100.83.164.94:7866"
      - "http://100.83.164.94:7867"
    concurrency_per_group:
      monkey: 3
      glm: 1
    max_failures:
      monkey: 3
    timeout: 600
    chunk_pages: 50
    overlap_pages: 2

model:
  model: glm-5.1
  base_url: "https://newapi.iomgaa.online"
  api_key: ${ANTHROPIC_API_KEY}
  fallback_model: glm-5.1

qmd:
  db_path: ./data/qmd.sqlite

workspace:
  workspaces_root: ./data/.govdoc/workspaces
  archives_root: ./data/.govdoc/archives
  cleanup_days: 30

evolution:
  enabled: false
  proposer_model: claude-sonnet-4-6
  frontier_size: 5
  eval_dataset_path: ./data/eval/checkpoints_golden.json

harness:
  db_path: ./results/harness.db
  judge_model: "glm-5.1"
  judge_base_url: "https://newapi.iomgaa.online/v1"

audit:
  point_timeout_s: 900

compare:
  # 与前端 HubPage 提示、后端校验三处同步。
  max_files: 6
  min_segment_length: 16
  pdf_timeout_s: 7200
  simhash_threshold: 10
  max_concurrent: 1
