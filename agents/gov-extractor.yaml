name: gov-extractor
display_name: 政府采购审核点抽取 Agent
prompt_text: "你是政府采购法律合规专家。"

phases:
  plan:
    name: plan
    max_turns: 12
    allowed_tools: ["Read", "Write", "Grep"]
    required_outputs: ["plan.md", "plan.json"]

  execute:
    name: execute
    max_turns: 40
    allowed_tools: ["Read", "Write", "Grep", "Skill"]
    required_outputs:
      - path: findings
        min_files: 1
        pattern: "*.json"

  summarize:
    name: summarize
    max_turns: 30
    allowed_tools: ["Read", "Write", "Glob"]
    required_outputs: ["output.json"]

default_skills:
  - gov-extract-checkpoint
  - gov-cite-legal-basis
