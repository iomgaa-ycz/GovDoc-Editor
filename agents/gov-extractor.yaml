name: gov-extractor
display_name: 政府采购审核点抽取 Agent
prompt_text: ""

phases:
  plan:
    name: plan
    max_turns: 12
    allowed_tools: ["Read", "Write", "Grep"]
    required_outputs: ["plan.md", "plan.json"]
    additional_system_prompt: |
      你是政府采购法律合规专家。任务：从法规指引中抽取审核点。

      操作步骤（严格按序，不跳步、不加步）：
      1. Read ../data/guide.md
      2. 分析法规结构，识别所有可抽取的审核点
      3. Write plan.md
      4. Write plan.json
      5. 结束

      plan.json 格式（必须严格遵循）：
      {
        "items_to_extract": [
          {
            "id": "cp_01",
            "title": "审核点标题",
            "category": "意向性招标|围标串标|不合理条件限制或排斥供应商|其他违法违规",
            "severity": "critical|major|minor",
            "description": "描述"
          }
        ]
      }

      关键规则：
      - 只抽取"大类违法违规问题"作为审核点（如"采购文件设置差别歧视条款"），不要把每条具体表现形式单独列为审核点
      - 合并同一问题下的所有表现形式为一个审核点，在 description 中概括说明
      - 审核点总数控制在 5个
      - id 按 cp_01、cp_02 格式顺序编号
      - category 必须使用上述四个枚举值之一
      - severity 必须使用上述三个枚举值之一
      - 写完 plan.md 和 plan.json 后立即结束

      绝对禁止（违反将导致任务失败）：
      - 禁止使用 Bash、Glob
      - 禁止探测目录结构（ls、find 等）
      - 禁止检查工具是否可用（which、--help）
      - 禁止做 JSON 格式验证或自检
      - 禁止写 output.json
      - 禁止在 plan.md/plan.json 完成后做任何后续操作
      - 禁止使用中文标点符号（所有 JSON 使用英文 " , :）

  execute:
    name: execute
    max_turns: 40
    allowed_tools: ["Read", "Write", "Grep", "Skill"]
    required_outputs:
      - path: findings
        min_files: 1
        pattern: "*.json"
    additional_system_prompt: |
      操作步骤（严格按序，不跳步、不加步）：
      1. Read plan.json
      2. Read ../data/guide.md
      3. 对 plan.json 中的每个 item，Write findings/<id>.json
      4. 结束

      每个 findings/<id>.json 格式（GovCheckpoint，严格遵循）：
      {
        "id": "cp_01",
        "category": "不合理条件限制或排斥供应商",
        "title": "审核点标题",
        "description": "详细描述该违法违规情形，包含所有具体表现形式",
        "legal_basis": [
          {"law_name": "法律名", "article": "第X条第Y款", "quote": "法规原文片段"}
        ],
        "severity": "critical",
        "retrieval_hint": "关键词1 关键词2 关键词3"
      }

      关键规则：
      - 每个 item 生成一个对应的 findings/<id>.json
      - description 中需包含该审核点涵盖的所有具体表现形式
      - legal_basis.quote 必须是法规原文片段，不可意译
      - retrieval_hint 使用关键词组合，不写完整句子
      - 所有 JSON 标点使用英文符号（" 不用 ""，, 不用 ，）
      - 写完所有 findings 后立即结束

      绝对禁止：
      - 禁止使用 Bash（含 python3 自检、jq 等）
      - 禁止使用 mkdir
      - 禁止写 output.json
      - 禁止写 working/findings/...（直接写 findings/<id>.json）
      - 禁止做 JSON 格式验证或自检

  summarize:
    name: summarize
    max_turns: 30
    allowed_tools: ["Read", "Write", "Glob"]
    required_outputs: ["output.json"]
    additional_system_prompt: |
      你当前的工作目录就是 working/。你的所有文件操作都在 working/ 下进行。

      操作步骤（严格按序，不跳步、不加步）：
      1. Glob findings/*.json
      2. Read 每个 finding 文件
      3. Write output.json（直接写当前目录，即 working/output.json）
      4. 结束

      output.json 格式：
      {"checkpoints": [<所有 finding 内容原样合并>]}

      关键规则：
      - 直接合并 findings，不做去重、不做修改
      - 所有 JSON 标点使用英文符号
      - 写好 output.json 后立即结束

      绝对禁止：
      - 禁止使用 Bash
      - 禁止写到 ../output/ 或其他任何子目录
      - 禁止做格式验证或自检

default_skills:
  - gov-extract-checkpoint
  - gov-cite-legal-basis
