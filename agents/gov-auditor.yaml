name: gov-auditor
display_name: 招标文书审核 Agent
prompt_text: "你是政府采购合规审核专家。"

external_cli_tools:
  - "govdoc-cli"

phases:
  plan:
    name: plan
    max_turns: 50
    allowed_tools: ["Read", "Write", "Grep", "Bash"]
    required_outputs: ["plan.md", "plan.json"]

  execute:
    name: execute
    max_turns: 50
    allowed_tools: ["Read", "Write", "Grep", "Bash", "Skill"]
    required_outputs:
      - path: findings
        min_files: 1
        pattern: "*.json"

  summarize:
    name: summarize
    max_turns: 16
    allowed_tools: ["Read", "Write", "Glob"]
    required_outputs: ["output.json"]

default_skills:
  - gov-audit-tender
  - gov-locate-evidence
  - gov-cite-legal-basis
